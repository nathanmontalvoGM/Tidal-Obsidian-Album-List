# Runs the Tidal sync on GitHub's servers every morning, so new favorites show up without your PC.
# Needs one repository secret: TIDAL_SESSION = the contents of tidal_session.json from your PC
# (GitHub > Settings > Secrets and variables > Actions > New repository secret).
# Run it by hand: GitHub > Actions > Tidal sync > Run workflow (tick "dry run" to only preview).
name: Tidal sync

on:
  schedule:
    - cron: "23 11 * * *"   # daily, 5:23 AM Central (6:23 during daylight time). GitHub can start it a little late.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would change, write nothing"
        type: boolean
        default: false

permissions:
  contents: write           # to push the new album notes

concurrency:
  group: tidal-sync         # never two syncs at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, so the push can be rebased onto commits made while it ran

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install "tidalapi==0.8.11" requests

      - name: Sync Tidal favorites
        env:
          TIDAL_SESSION: ${{ secrets.TIDAL_SESSION }}
        run: |
          if [ -z "$TIDAL_SESSION" ]; then
            echo "::error::The TIDAL_SESSION secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          python _code/sync_tidal.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "Tidal sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new from Tidal."
            exit 0
          fi
          new=$(git diff --cached --name-only --diff-filter=A -- '*.md' | { grep -v '^00 Dashboard/' || true; } | wc -l)
          if [ "$new" -gt 0 ]; then msg="Tidal sync: $new new album(s)"; else msg="Tidal sync: updates"; fi
          git commit -q -m "$msg"
          for attempt in 1 2 3; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "Push failed (attempt $attempt), retrying..."; sleep 10
          done
          echo "::error::Could not push the sync results."; exit 1
